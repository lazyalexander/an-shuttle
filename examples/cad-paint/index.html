<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>CAD 绘画台</title><style>
*{box-sizing:border-box}body{margin:0;background:#ecede8;color:#243833;font:15px/1.5 system-ui}header,footer{padding:16px 5vw;background:#20352f;color:#f3f1df;display:flex;align-items:center;justify-content:space-between}h1{font-size:20px;margin:0}small{color:#64776d}main{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:22px;padding:24px 5vw}figure,aside{margin:0;background:#fafbf6;border:1px solid #c1cbc1;border-radius:10px;padding:18px}canvas{width:100%;aspect-ratio:960/680;background:radial-gradient(ellipse,#fffef5,#d5ddd1);display:block}fieldset{border:0;padding:0;margin:0}label{display:block;margin:.6em 0}#reuseGripOption[hidden]{display:none}input[type=range]{width:100%;accent-color:#247969}button{font:inherit;background:#235b4c;color:white;border:0;padding:10px 16px;border-radius:5px;cursor:pointer}button:disabled,fieldset:disabled{opacity:.65}select{float:right}#materials label{min-height:26px}output{float:right}footer a{color:#ffe0a0}#asset{max-width:100%;background:#dae1d7}#error{color:#923c28}@media(max-width:800px){main{grid-template-columns:1fr}header,footer{gap:8px;flex-wrap:wrap}}
</style><header><h1 id="title">CAD 绘画台</h1><span id="status" role="status">连接 CAD…</span></header>
<main><figure><small>装配预览 · 正交投影</small><canvas width="960" height="680" aria-label="3D CAD"></canvas><figcaption>调整模型参数和视角，保存这一版以生成独立的绘画素材。</figcaption></figure><aside>
<fieldset id="controls" disabled><label for="gap"><span id="parameterLabel">参数</span> <output id="gapValue"></output><input id="gap" aria-labelledby="parameterLabel" type="range"></label>
<label>水平视角<input id="yaw" type="range" min="-180" max="180" value="38"></label><label>俯视角<input id="elevation" type="range" min="5" max="80" value="28"></label>
<label><input id="sendCamera" type="checkbox" checked> 提供当前机位</label><label>光源方位<input id="light" type="range" min="-180" max="180" value="55"></label><label><input id="sendLight" type="checkbox"> 提供光源（留空则随机）</label>
<h3>分部件材质</h3><div id="materials"></div><label id="reuseGripOption" hidden><input id="reuseGrip" type="checkbox"> <span id="reuseGripLabel"></span></label><label>缺失材质的绘制要求<input id="direction" maxlength="500" placeholder="例如：握柄采用哑光胡桃木"></label><button id="save">保存并绘制</button></fieldset><p id="error" role="alert"></p></aside>
<figure id="delivery" hidden><small>独立绘画素材</small><img id="asset" alt="已保存版本的绘制结果"></figure></main>
<footer><span id="version">CAD</span><a id="download" hidden download>下载 Krita 分层素材</a><button id="cut" hidden disabled>送交切割 spool</button></footer>
<script type="importmap">{"imports":{"@an-shuttle/cad/scene.js":"/scene.js","@an-shuttle/cad/drawing.js":"/drawing.js"}}</script><script type="module" src="/app.js"></script></html>
