name: Native CAD spool
on:
  push:
    branches: [main]
    paths:
      - 'package-lock.json'
      - '.github/workflows/loom-spool.yml'
  pull_request:
    paths:
      - 'package-lock.json'
      - 'examples/cad-paint/**'
      - 'packages/cad/**'
      - 'packages/krita/**'
      - '.github/scripts/qualify-painted-spool.py'
      - '.github/workflows/loom-spool.yml'
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 40
    env:
      CARGO_INCREMENTAL: '0'
      LOOM_REV: 9089b0283cc9077f51447e38b32f553049948d98
      MATERIAL_READER_REV: f307fb15604fd8219f942b2f8491c70b67fe96b4
      HOST_REV: 7c5fa1f2c70d36fbdd8b4054ca9384dfa9174f75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        id: native-tools
        with:
          path: integrations/bin
          key: cad-native-tools-release-1-${{ runner.os }}-${{ runner.arch }}-${{ env.LOOM_REV }}-${{ env.HOST_REV }}
      - uses: actions/checkout@v4
        if: steps.native-tools.outputs.cache-hit != 'true'
        with:
          repository: lazyalexander/an-loom
          ref: ${{ env.LOOM_REV }}
          path: integrations/loom
          persist-credentials: false
      - uses: actions/checkout@v4
        if: steps.native-tools.outputs.cache-hit != 'true'
        with:
          repository: lazyalexander/an-agent
          ref: ${{ env.HOST_REV }}
          path: integrations/host
          persist-credentials: false
      - name: Build pinned Loom and host tools
        if: steps.native-tools.outputs.cache-hit != 'true'
        run: |
          mkdir -p integrations/bin
          export CARGO_TARGET_DIR="$RUNNER_TEMP/native-target"
          (cd integrations/loom && cargo build --locked --release --bin an-loom)
          (cd integrations/host && cargo build --locked --release --bin an-agent-host)
          cp "$CARGO_TARGET_DIR/release/an-loom" "$CARGO_TARGET_DIR/release/an-agent-host" integrations/bin/
      - uses: actions/cache/save@v4
        if: steps.native-tools.outputs.cache-hit != 'true'
        with:
          path: integrations/bin
          key: ${{ steps.native-tools.outputs.cache-primary-key }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: node_modules/@an-loom/cad-paint-spool/dist/requirements.txt
      - name: Prepare pinned Python runtime
        run: |
          python -m venv --without-pip "$RUNNER_TEMP/paint-env"
          requirements=$(node -p "require.resolve('@an-loom/cad-paint-spool/requirements')")
          archive=$(node -p "require.resolve('@an-loom/cad-paint-spool/archive')")
          python -m pip --python "$RUNNER_TEMP/paint-env" install --only-binary=:all: --no-compile -r "$requirements"
          ln -s "$PWD/integrations/bin/an-agent-host" "$RUNNER_TEMP/paint-host"
          work="$RUNNER_TEMP/paint-qualification"
          mkdir "$work"
          echo "$PWD/integrations/bin" >> "$GITHUB_PATH"
          echo "CAD_PAINT_TEST_OUTPUT=$work" >> "$GITHUB_ENV"
          echo "CAD_PAINT_RUNTIME=$work/runtime.json" >> "$GITHUB_ENV"
          echo "AN_AGENT_HOST_BIN=$RUNNER_TEMP/paint-host" >> "$GITHUB_ENV"
          PATH="$PWD/integrations/bin:$PATH" "$RUNNER_TEMP/paint-env/bin/python" -B .github/scripts/qualify-painted-spool.py "$archive" "$work"
      - uses: actions/checkout@v4
        with:
          repository: lazyalexander/an-loom
          ref: ${{ env.MATERIAL_READER_REV }}
          path: integrations/material-evidence
          persist-credentials: false
      - name: Browser save (vise)
        if: ${{ false }}
        timeout-minutes: 4
        env:
          CAD_PAINT_FIXTURE: vise
          CAD_MATERIAL_READER: ${{ github.workspace }}/integrations/material-evidence/examples/cad-material-evidence/read_material.py
        run: node --test examples/cad-paint/dist/managed.test.js
      - name: Start local Ollama with qwen3:8b
        timeout-minutes: 14
        run: |
          brew install ollama
          export OLLAMA_HOST=127.0.0.1:11434
          OLLAMA_CONTEXT_LENGTH=2048 OLLAMA_NUM_PARALLEL=1 OLLAMA_MAX_LOADED_MODELS=1 OLLAMA_KEEP_ALIVE=20m \
            ollama serve > "$RUNNER_TEMP/ollama.log" 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:11434/api/version; then break; fi
            sleep 1
          done
          ollama pull qwen3:8b
          ollama list
          ollama list | awk '$1 == "qwen3:8b" && $2 == "500a1f067a9f" {found=1} END {exit !found}'
          curl -fsS --max-time 420 http://127.0.0.1:11434/api/generate \
            -H 'Content-Type: application/json' \
            -d '{"model":"qwen3:8b","prompt":"","stream":false,"keep_alive":"20m"}'
          ollama ps
      - name: Browser save (handwheel, live Ollama)
        timeout-minutes: 24
        env:
          CAD_PAINT_FIXTURE: handwheel
          CAD_PAINT_REAL_MODEL: 1
          CAD_PAINT_CANCEL_ONLY: 1
          OLLAMA_MODEL: qwen3:8b
          CAD_MATERIAL_HOST_AGENT: 1
          CAD_MATERIAL_READER: ${{ github.workspace }}/integrations/material-evidence/examples/cad-material-evidence/read_material.py
        run: node --test examples/cad-paint/dist/managed.test.js
      - name: Browser save (incomplete)
        if: ${{ false }}
        timeout-minutes: 3
        env:
          CAD_PAINT_FIXTURE: incomplete
        run: node --test examples/cad-paint/dist/managed.test.js
      - name: Cancel an observed native paint attempt
        if: ${{ false }}
        timeout-minutes: 3
        env:
          CAD_PAINT_FIXTURE: cancelled
        run: node --test examples/cad-paint/dist/managed.test.js
      - name: Inspect original fixture attempts on failure
        if: failure()
        run: |
          if [ -f "$RUNNER_TEMP/ollama.log" ]; then tail -50 "$RUNNER_TEMP/ollama.log"; fi
          for instance in "$CAD_PAINT_TEST_OUTPUT"/*/drawing-*/instance; do
            [ -d "$instance" ] || continue
            an-agent-host spool-status "$instance" paint || true
            find "$instance/runs" -name stderr.txt -exec tail -c 1000 {} \;
          done
      - name: Verify both accepted catalogs and the failure receipt
        if: ${{ false }}
        run: '"$RUNNER_TEMP/paint-env/bin/python" -B .github/scripts/qualify-painted-spool.py verify "$CAD_PAINT_TEST_OUTPUT"'
