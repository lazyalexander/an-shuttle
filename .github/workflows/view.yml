name: View acceptance
on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'package-lock.json'
      - '**/tsconfig*.json'
      - 'examples/**/*.ts'
      - 'examples/cad-paint/*.py'
      - 'examples/cad-paint/authoring-requirements.txt'
      - 'packages/**/*.ts'
      - '.github/workflows/view.yml'
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            node_modules/@an-loom/cad-paint-spool/dist/requirements.txt
            examples/cad-paint/authoring-requirements.txt
      - run: python -m pip install -r examples/cad-paint/requirements.txt -r examples/cad-paint/authoring-requirements.txt
      - run: python -m unittest discover -s examples/cad-paint -p test_export_scad.py
      - uses: actions/cache@v4
        with:
          path: |
            packages/*/dist
            examples/*/dist
          key: ${{ runner.os }}-ts-${{ hashFiles('package-lock.json', '**/tsconfig*.json') }}-${{ hashFiles('packages/**/*.ts', 'examples/**/*.ts') }}
          restore-keys: |
            ${{ runner.os }}-ts-${{ hashFiles('package-lock.json', '**/tsconfig*.json') }}-
      - run: npm run build
      - run: npm test
      - name: Check two real Chrome tabs
        run: npm run test:browser
